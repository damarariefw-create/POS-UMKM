<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                // Light haptic feedback simulation could go here
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            });
        });

        // Simple Category Switch Logic
        const catButtons = document.querySelectorAll('.flex-shrink-0');
        catButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                catButtons.forEach(b => {
                    b.classList.remove('bg-primary', 'text-on-primary', 'shadow-md');
                    b.classList.add('bg-surface', 'border', 'border-outline-variant', 'text-on-surface-variant');
                });
                btn.classList.remove('bg-surface', 'border', 'border-outline-variant', 'text-on-surface-variant');
                btn.classList.add('bg-primary', 'text-on-primary', 'shadow-md');
            });
        });
    </script>
