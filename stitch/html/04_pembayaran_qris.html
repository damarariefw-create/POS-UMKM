<script>
        // Simple micro-interaction for the print button
        document.querySelector('button:has(span:contains("print"))')?.addEventListener('click', function() {
            const originalContent = this.innerHTML;
            this.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Mencetak...';
            this.disabled = true;
            setTimeout(() => {
                this.innerHTML = '<span class="material-symbols-outlined">check</span> Struk Terkirim';
                setTimeout(() => {
                    this.innerHTML = originalContent;
                    this.disabled = false;
                }, 2000);
            }, 1500);
        });

        // Helper to find span by text content (Utility for the script above)
        // Note: contains() is a jQuery thing, adding vanilla equivalent
        document.querySelectorAll('button').forEach(btn => {
           if(btn.innerText.includes('Cetak Struk')) {
               btn.onclick = function() {
                    const originalContent = this.innerHTML;
                    this.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Mencetak...';
                    setTimeout(() => {
                        this.innerHTML = '<span class="material-symbols-outlined text-primary">check_circle</span> Berhasil';
                        setTimeout(() => {
                            this.innerHTML = originalContent;
                        }, 2000);
                    }, 1200);
               }
           }
        });
    </script>
