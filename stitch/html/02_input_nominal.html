<body class="bg-background text-on-surface h-screen flex flex-col overflow-hidden">

<div>

<!-- Numeric Keypad Area - Optimized for Thumb Reach -->

<div class="numpad-grid">
<!-- Numbers 1-9 -->

<button class="active-tap h-20 bg-surface rounded-xl flex items-center justify-center text-2xl font-bold border border-border shadow-sm" onclick="appendNum('2')">2</button>
<button class="active-tap h-20 bg-surface rounded-xl flex items-center justify-center text-2xl font-bold border border-border shadow-sm" onclick="appendNum('3')">3</button>
<button class="active-tap h-20 bg-surface rounded-xl flex items-center justify-center text-2xl font-bold border border-border shadow-sm" onclick="appendNum('4')">4</button>
<button class="active-tap h-20 bg-surface rounded-xl flex items-center justify-center text-2xl font-bold border border-border shadow-sm" onclick="appendNum('5')">5</button>
<button class="active-tap h-20 bg-surface rounded-xl flex items-center justify-center text-2xl font-bold border border-border shadow-sm" onclick="appendNum('6')">6</button>

<button class="active-tap h-20 bg-error-container text-on-error-container rounded-xl flex items-center justify-center border border-error/20 shadow-sm" onclick="clearDisplay()">
<span class="material-symbols-outlined" data-icon="backspace">backspace</span>
</button>

</button>

</div>

</button>

<span class="material-symbols-outlined">person</span>

</button>
</div></footer>
<script>
        let currentInput = "";
        let cashReceived = 0;

        function updateDisplay() {
            const formatted = new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(currentInput || 0);
            
            document.getElementById('main-display').innerText = formatted;
            calculateChange();
        }

        function appendNum(num) {
            if (currentInput.length > 10) return;
            currentInput += num;
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = currentInput.slice(0, -1);
            updateDisplay();
        }

        function setCash(amount) {
            cashReceived = amount;
            document.getElementById('cash-input').value = amount;
            calculateChange();
            
            // Subtle feedback
            const btn = event.currentTarget;
            btn.classList.add('bg-secondary-container');
            setTimeout(() => btn.classList.remove('bg-secondary-container'), 200);
        }

        function calculateChange() {
            const bill = parseInt(currentInput) || 0;
            const change = cashReceived - bill;
            const display = document.getElementById('change-display');
            
            if (change < 0) {
                display.innerText = "Kurang Rp " + Math.abs(change).toLocaleString('id-ID');
                display.classList.replace('text-primary', 'text-error');
            } else {
                display.innerText = "Rp " + change.toLocaleString('id-ID');
                display.classList.replace('text-error', 'text-primary');
            }
        }
    </script>
