<!DOCTYPE html><html lang="id"><head>

                    "secondary-container": "#82f5c1",

                    "surface-bright": "#f5fbf2",

            "borderRadius": {

<style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .big-touch-target { min-height: 48px; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col items-center">
<!-- Top AppBar (JSON Derived) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center h-16 px-4 bg-surface shadow-sm border-b border-border">
<div class="flex items-center gap-3">
<button class="active:bg-surface-variant p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">Tambah Produk Baru</h1>
</div>
<div class="flex items-center gap-2">

</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md mt-16 px-4 py-6 flex flex-col gap-6 overflow-y-auto no-scrollbar mb-[180px]">
<!-- Image Upload Section -->
<section class="flex flex-col gap-2">
<label class="font-label-sm text-on-surface-variant uppercase tracking-widest px-1">Foto Produk</label>
<div class="relative w-full aspect-square rounded-xl bg-surface-container-high border-2 border-dashed border-outline-variant flex flex-col items-center justify-center gap-3 active:bg-surface-variant transition-colors overflow-hidden group">
<div class="flex flex-col items-center gap-2 text-on-surface-variant group-active:scale-95 transition-transform">
<span class="material-symbols-outlined text-4xl">add_a_photo</span>
<span class="font-headline-md-mobile">Ambil Foto Produk</span>
<p class="text-label-sm opacity-70">atau pilih dari galeri</p>
</div>
<!-- Placeholder for Image Preview Logic -->
<div class="absolute inset-0 hidden bg-cover bg-center" id="image-preview"></div>
</div>
</section>
<!-- Product Name Input -->
<section class="flex flex-col gap-2">
<label class="font-label-sm text-on-surface-variant uppercase tracking-widest px-1" for="product-name">Nama Produk</label>
<input class="w-full h-14 bg-surface border border-outline-variant rounded-lg px-4 text-headline-md-mobile focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-on-surface-variant/40" id="product-name" placeholder="Contoh: Cabai Rawit Merah" type="text">
</section>
<!-- Price & Unit Section -->
<section class="flex flex-col gap-2">
<label class="font-label-sm text-on-surface-variant uppercase tracking-widest px-1">Harga &amp; Satuan</label>
<div class="flex gap-2">
<div class="relative flex-1">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-bold">Rp</span>
<input class="w-full h-14 bg-surface border border-outline-variant rounded-lg pl-12 pr-4 text-headline-md-mobile focus:ring-2 focus:ring-primary outline-none" inputmode="numeric" placeholder="0" type="number">
</div>
<div class="relative w-32">
<select class="w-full h-14 bg-surface border border-outline-variant rounded-lg px-3 appearance-none font-bold text-on-surface focus:ring-2 focus:ring-primary outline-none">
<option value="kg">/ kg</option>
<option value="ons">/ ons</option>
<option value="pcs">/ pcs</option>
<option value="renteng">/ renteng</option>
<option value="pack">/ pack</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
</section>
<!-- Stock/Quantity Stepper -->
<section class="flex flex-col gap-2">
<label class="font-label-sm text-on-surface-variant uppercase tracking-widest px-1">Stok Awal</label>
<div class="flex items-center justify-between bg-surface border border-outline-variant rounded-lg p-2 h-16">
<button class="w-12 h-12 flex items-center justify-center bg-surface-container-low rounded-lg active:bg-surface-variant text-primary transition-colors" onclick="decrementStock()">
<span class="material-symbols-outlined font-bold">remove</span>
</button>
<div class="flex flex-col items-center">
<input class="w-20 text-center border-none focus:ring-0 text-headline-lg-mobile font-bold bg-transparent" id="stock-input" type="number" value="1">
<span class="text-label-sm text-on-surface-variant -mt-1" id="unit-display">kg</span>
</div>
<button class="w-12 h-12 flex items-center justify-center bg-primary-container text-on-primary-container rounded-lg active:brightness-90 transition-colors" onclick="incrementStock()">
<span class="material-symbols-outlined font-bold">add</span>
</button>
</div>
</section>
<!-- Category Chip Selector (Optional but useful UX) -->
<section class="flex flex-col gap-2">
<label class="font-label-sm text-on-surface-variant uppercase tracking-widest px-1">Kategori</label>
<div class="flex gap-2 overflow-x-auto no-scrollbar pb-2">
<button class="px-4 py-2 bg-secondary-container text-on-secondary-container rounded-full font-label-sm whitespace-nowrap">Sayuran Hijau</button>
<button class="px-4 py-2 bg-surface-container text-on-surface-variant border border-outline-variant rounded-full font-label-sm whitespace-nowrap">Bumbu Dapur</button>
<button class="px-4 py-2 bg-surface-container text-on-surface-variant border border-outline-variant rounded-full font-label-sm whitespace-nowrap">Buah</button>
<button class="px-4 py-2 bg-surface-container text-on-surface-variant border border-outline-variant rounded-full font-label-sm whitespace-nowrap">Sembako</button>
</div>
</section>
</main>
<!-- Sticky Bottom Bar (JSON Derived Shell) -->
<nav class="fixed left-0 w-full flex h-[100px] gap-0 px-0 bg-surface shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] border-t border-border z-50 bottom-[80px]">
<button class="flex-1 flex flex-col items-center justify-center h-full bg-primary text-on-primary font-bold active:brightness-90 transition-all uppercase tracking-widest gap-1">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save</span>
<span class="font-headline-md-mobile">Simpan Produk</span>
</button>
</nav><nav class="fixed bottom-0 left-0 w-full h-[80px] bg-surface border-t border-border flex items-center justify-around z-50 px-2">
<button class="flex flex-col items-center gap-1 text-on-surface-variant active:bg-surface-variant p-2 rounded-lg transition-colors">
<span class="material-symbols-outlined">home</span>
<span class="text-label-sm">Beranda</span>
</button>
<button class="flex flex-col items-center gap-1 text-on-surface-variant active:bg-surface-variant p-2 rounded-lg transition-colors">
<span class="material-symbols-outlined">receipt_long</span>
<span class="text-label-sm">Riwayat</span>
</button>
<button class="flex flex-col items-center gap-1 text-on-surface-variant active:bg-surface-variant p-2 rounded-lg transition-colors">
<span class="material-symbols-outlined">group</span>
<span class="text-label-sm">Pelanggan</span>
</button>
<button class="flex flex-col items-center gap-1 bg-secondary-container text-on-secondary-container px-4 py-2 rounded-xl transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="text-label-sm">Profil</span>
</button>
</nav>
<!-- Hidden Navigation Drawer (JSON Guidance) -->
<div class="fixed inset-0 bg-black/40 z-[60] hidden transition-opacity" id="drawer-overlay" onclick="toggleDrawer()"></div>
<aside class="fixed top-0 left-0 h-full w-80 bg-surface-container-lowest z-[70] -translate-x-full transition-transform duration-300 ease-in-out shadow-xl flex flex-col py-6" id="drawer">
<div class="px-6 mb-8">
<h2 class="font-headline-lg-mobile text-primary font-bold">SayurKu Menu</h2>
</div>
<nav class="flex flex-col">
<div class="text-on-surface-variant p-4 flex items-center gap-4 hover:bg-surface-variant">
<span class="material-symbols-outlined">inventory_2</span>
<span class="font-headline-md-mobile">Inventory</span>
</div>
<div class="text-on-surface-variant p-4 flex items-center gap-4 hover:bg-surface-variant">
<span class="material-symbols-outlined">history</span>
<span class="font-headline-md-mobile">History</span>
</div>
<div class="text-on-surface-variant p-4 flex items-center gap-4 hover:bg-surface-variant">
<span class="material-symbols-outlined">payments</span>
<span class="font-headline-md-mobile">Debt</span>
</div>
<div class="text-on-surface-variant p-4 flex items-center gap-4 hover:bg-surface-variant">
<span class="material-symbols-outlined">assessment</span>
<span class="font-headline-md-mobile">Reports</span>
</div>
</nav>
</aside>
<script>
        function incrementStock() {
            const input = document.getElementById('stock-input');
            input.value = parseInt(input.value) + 1;
        }

        function decrementStock() {
            const input = document.getElementById('stock-input');
            if (parseInt(input.value) > 0) {
                input.value = parseInt(input.value) - 1;
            }
        }

        function toggleDrawer() {
            const drawer = document.getElementById('drawer');
            const overlay = document.getElementById('drawer-overlay');
            drawer.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        // Handle Unit Selection sync for Stock Label
        document.querySelector('select').addEventListener('change', function(e) {
            document.getElementById('unit-display').innerText = e.target.value;
        });

        // Add menu button functionality
        document.querySelector('button span[data-icon="menu"], button span:contains("menu")')?.parentElement?.addEventListener('click', toggleDrawer);
        // Fallback for the icon based toggle
        document.querySelector('.material-symbols-outlined').parentElement.onclick = function(e) {
            if(this.querySelector('.material-symbols-outlined').innerText === 'menu') toggleDrawer();
            else history.back();
        };
    </script>


</body></html>
